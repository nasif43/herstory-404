<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HerStory</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        html{
            height:100%;
        }
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background: #000;
            width:100%;
            overflow:hidden;
            position:relative;
        }
        
        /* Blurry black background effect */
        body::before{
            content:'';
            position:absolute;
            top:0;
            left:0;
            right:0;
            bottom:0;
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(0,0,0,0.7));
            backdrop-filter: blur(20px);
            z-index:-1;
        }
        
        img{
            max-height:100vh;
            max-width:100vw;
            width:auto;
            height:auto;
            display:block;
            object-fit:contain;
            z-index:1;
        }
    </style>
</head>
<body>
    <img src="herstory.jpeg" alt="HerStory">
</body>
</html>
